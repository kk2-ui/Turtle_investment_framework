# 财务趋势信号检测规则 — 声明式配置
# 被 rule_engine.py 加载和执行
# 分析师可在此文件中新增规则，无需修改 Python 代码

rules:
  - id: gross_margin_decline
    severity: warn
    fields: [gross_margin]
    pattern: consecutive_decline
    params: { min_years: 3, min_magnitude_pp: 3.0 }
    title: "毛利率连续下滑"
    detail: "从 FY{start_year} 的 {from_val}% 降至 FY{end_year} 的 {to_val}%，累计压缩 {delta}pp"

  - id: zero_leverage
    severity: positive
    fields: [st_borr, lt_borr]
    pattern: all_zero
    params: { min_years: 3 }
    title: "连续零有息负债"
    detail: "连续 {years} 年无任何银行借款或债券融资"

  - id: ar_deterioration
    severity: warn
    fields: [accounts_receiv, revenue]
    pattern: ratio_rising
    params: { min_years: 3, min_rise_pp: 5.0 }
    title: "应收/营收占比持续上升"
    detail: "从 FY{start_year} 的 {from_val}% 升至 FY{end_year} 的 {to_val}%，回款恶化"

  - id: fcf_positive_streak
    severity: positive
    fields: [fcf]
    pattern: all_positive
    params: { min_years: 5 }
    title: "FCF 持续为正"
    detail: "自由现金流连续 {years} 年为正"

  - id: goodwill_jump
    severity: warn
    fields: [goodwill]
    pattern: yoy_jump
    params: { threshold_pct: 50 }
    title: "商誉跳变"
    detail: "FY{year} 商誉从 {from_val}M 变为 {to_val}M（{pct}%变动）"

  - id: revenue_up_np_down
    severity: warn
    fields: [revenue, n_income_attr_p]
    pattern: divergence
    params: { min_years: 2 }
    title: "增收不增利"
    detail: "营收 CAGR {rev_cagr}% 但归母净利 CAGR {np_cagr}%，利润率侵蚀"

  - id: dividend_sustainable
    severity: positive
    fields: [eps, dps]
    pattern: eps_gt_dps
    params: { min_years: 5 }
    title: "分红可持续（EPS > DPS）"
    detail: "EPS 始终大于 DPS 连续 {years} 年"

  - id: net_cash
    severity: positive
    fields: [money_cap, total_liab]
    pattern: field_a_gt_field_b
    params: {}
    title: "净现金状态"
    detail: "货币资金 {cash}M > 总负债 {liab}M，净现金 {net}M"

  - id: roe_decline
    severity: warn
    fields: [total_hldr_eqy_exc_min_int, n_income_attr_p]
    pattern: roe_consecutive_decline
    params: { min_years: 3, min_magnitude_pp: 3.0 }
    title: "ROE 连续下滑"
    detail: "从 FY{start_year} 的 {from_val}% 降至 FY{end_year} 的 {to_val}%"

  - id: dps_decline
    severity: info
    fields: [dps]
    pattern: consecutive_decline
    params: { min_years: 3, min_magnitude_pp: 0 }
    title: "DPS 连续下滑"
    detail: "每股股息从 FY{start_year} 的 {from_val} 降至 FY{end_year} 的 {to_val}"
